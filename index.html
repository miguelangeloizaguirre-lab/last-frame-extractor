<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastFrameExtractor - Extrae cualquier fotograma o el último fotograma</title>
    <meta name="description" content="Herramienta gratuita para extraer el último fotograma o cualquier fotograma de videos MP4, MOV o WebM.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans selection:bg-accentBlue selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-gray-800 bg-darkBg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accentBlue to-accentPurple flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-film text-white text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">
                    Last<span class="text-accentBlue">Frame</span>Extractor
                </span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-500/10 text-accentBlue border border-blue-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-accentBlue mr-1.5 animate-pulse"></span>
                    Online & Listo
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-start px-4 sm:px-6 lg:px-8 py-8 max-w-5xl mx-auto w-full space-y-8">

        <!-- Hero Section -->
        <div class="text-center space-y-4 max-w-3xl">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
                Extrae el <span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue via-indigo-400 to-accentPurple">Último Fotograma</span> de tu Video
            </h1>
            <p class="text-lg text-gray-400">
                Herramienta rápida y privada directamente en tu navegador. Ideal para creadores de contenido e Inteligencia Artificial (Runway, Kling, Sora).
            </p>
        </div>

        <!-- Tool Card Box -->
        <div id="tool" class="w-full bg-cardBg border border-gray-800/80 rounded-2xl shadow-2xl p-6 sm:p-10 relative overflow-hidden backdrop-blur-sm">
            
            <!-- Drag & Drop Zone -->
            <div id="drop-zone" class="border-2 border-dashed border-gray-700 hover:border-accentBlue/50 transition-all rounded-xl p-8 sm:p-12 text-center flex flex-col items-center justify-center cursor-pointer bg-darkBg/40 group">
                <div class="w-16 h-16 rounded-2xl bg-accentBlue/10 group-hover:bg-accentBlue/20 text-accentBlue flex items-center justify-center mb-4 transition-colors">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-200 mb-1">Arrastra tu video aquí</h3>
                <p class="text-sm text-gray-400 mb-6">Soporta formatos MP4, MOV, WebM</p>
                <label class="px-6 py-3 bg-accentBlue hover:bg-blue-600 text-white font-medium rounded-xl cursor-pointer shadow-lg shadow-blue-500/25 transition-all transform hover:-translate-y-0.5">
                    Seleccionar Archivo
                    <input type="file" id="video-file-input" accept="video/mp4,video/quicktime,video/webm" class="hidden">
                </label>
            </div>

            <!-- Video Processing & Selector Area (Oculto inicialmente) -->
            <div id="preview-container" class="hidden space-y-6">
                <!-- Header Status -->
                <div class="flex items-center justify-between bg-darkBg/60 p-4 rounded-xl border border-gray-800">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <i class="fa-solid fa-file-video text-accentBlue text-xl"></i>
                        <span id="file-name" class="text-sm font-medium text-gray-300 truncate">video.mp4</span>
                    </div>
                    <button id="remove-file" class="text-gray-400 hover:text-red-400 transition-colors text-sm px-3 py-1.5 rounded-lg bg-gray-800/50 hover:bg-red-500/10">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Cambiar Video
                    </button>
                </div>

                <!-- Video Player Preview -->
                <div class="relative rounded-xl overflow-hidden border border-gray-800 shadow-2xl bg-black flex justify-center items-center">
                    <video id="source-video" class="max-h-[420px] w-auto mx-auto" preload="auto" playsinline></video>
                </div>

                <!-- Interactive Player Controls -->
                <div class="bg-darkBg/80 p-5 rounded-xl border border-gray-800 space-y-4">
                    <!-- Timeline Slider & Time Display -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center text-xs font-mono text-gray-400">
                            <span id="current-time-display">00:00.00</span>
                            <span id="total-time-display">00:00
